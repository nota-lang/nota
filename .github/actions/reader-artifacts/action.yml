name: Reader artifacts
description: >-
  Build (or restore from cache, keyed on the oxc submodule SHA) the release nota_compile binary
  and both wasm targets. Leaves them at their in-tree paths (oxc/target/…, oxc/napi/nota_wasm/…)
  AND staged under reader-dist/ for artifact upload. Requires the repo checked out with the oxc
  submodule.

runs:
  using: composite
  steps:
    - name: Resolve submodule SHA
      id: submodule
      shell: bash
      run: echo "sha=$(git rev-parse HEAD:oxc)" >> "$GITHUB_OUTPUT"

    - name: Cache reader artifacts
      id: cache
      uses: actions/cache@v4
      with:
        path: reader-dist
        key: reader-dist-v1-${{ runner.os }}-${{ steps.submodule.outputs.sha }}

    - name: Cache cargo build
      if: steps.cache.outputs.cache-hit != 'true'
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: oxc

    - name: Install wasm-pack
      if: steps.cache.outputs.cache-hit != 'true'
      uses: taiki-e/install-action@v2
      with:
        tool: wasm-pack

    - name: Build nota_compile (release)
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: oxc
      run: cargo build --release -p oxc --example nota_compile --features codegen

    # build-wasm.mjs patches the generated package.jsons to @nota-lang/wasm{,-node} — the names
    # the workspace file: deps expect; raw wasm-pack would break pnpm install downstream.
    - name: Build nota_wasm (web + node)
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: oxc
      run: |
        rustup target add wasm32-unknown-unknown
        node ../scripts/build-wasm.mjs

    - name: Stage artifacts
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        mkdir -p reader-dist
        cp oxc/target/release/examples/nota_compile reader-dist/
        cp -R oxc/napi/nota_wasm/pkg reader-dist/pkg
        cp -R oxc/napi/nota_wasm/pkg-node reader-dist/pkg-node

    - name: Restore artifacts into the tree (cache hit)
      if: steps.cache.outputs.cache-hit == 'true'
      shell: bash
      run: |
        mkdir -p oxc/target/release/examples oxc/napi/nota_wasm
        cp reader-dist/nota_compile oxc/target/release/examples/
        chmod +x oxc/target/release/examples/nota_compile
        rm -rf oxc/napi/nota_wasm/pkg oxc/napi/nota_wasm/pkg-node
        cp -R reader-dist/pkg oxc/napi/nota_wasm/pkg
        cp -R reader-dist/pkg-node oxc/napi/nota_wasm/pkg-node
