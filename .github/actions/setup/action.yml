name: Setup

runs:
  using: composite
  steps:
      - name: Install depot
        uses: cognitive-engineering-lab/depot/actions/install@main

      - name: Install Binaryen
        env:
          BINARYEN_VERSION: "132"
        run: |
          mkdir -p "$RUNNER_TEMP/binaryen"
          curl -fsSL "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz" \
            | tar xz --strip-components=1 -C "$RUNNER_TEMP/binaryen"
          echo "$RUNNER_TEMP/binaryen/bin" >> "$GITHUB_PATH"

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.126

      - name: Install Just
        uses: extractions/setup-just@v3

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: oxc

      - name: Build Nota wasm
        working-directory: oxc
        shell: bash
        run: |
          rustup target add wasm32-unknown-unknown
          just nota-build
