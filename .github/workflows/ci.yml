name: CI

on: [push, pull_request]
  
permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    env:
      NOTA_COMPILE_BIN: ${{ github.workspace }}/oxc/target/debug/examples/nota_compile

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache oxc cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: oxc

      - name: Build nota_compile
        working-directory: oxc
        run: cargo build --example nota_compile

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Build nota_wasm
        working-directory: oxc
        run: |
          rustup target add wasm32-unknown-unknown
          wasm-pack build napi/nota_wasm --target web --out-dir pkg --out-name nota_wasm

      - name: Install depot
        uses: cognitive-engineering-lab/depot/actions/install@main

      - name: Run tests
        run: depot test
