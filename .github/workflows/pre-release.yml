name: Pre-release

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, edited]

jobs:
  pre-release:
    name: Publish dry run
    if: contains(github.event.pull_request.labels.*.name, 'release')
    runs-on: ubuntu-latest
    steps:
      - name: Version from PR title
        id: version
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ "$TITLE" =~ ^v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$ ]]; then
            echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "::error::release PRs must be titled vX.Y.Z (got: $TITLE)"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build
        run: depot build --release

      # Lockstep version for every workspace package (incl. the generated wasm manifests) from the
      # PR title — no bump commits; `pnpm publish` rewrites `workspace:*` deps to this version.
      - name: Stamp version
        run: pnpm -r exec npm pkg set version=${{ steps.version.outputs.version }}

      - name: Publish (dry run)
        run: pnpm publish --recursive --dry-run --access public --no-git-checks
