name: Release dry run

# The pre-release gate: a PR titled `vX.Y.Z` and labeled `release` runs the ENTIRE release
# pipeline except publishing — build, pack (both ref flavors), and a clean-room install smoke
# test of the packed CLI. Merging the PR then triggers release.yml, which packs the same way
# and publishes (creating the tag). The publishable url-ref tarballs upload as a workflow
# artifact for inspection on the PR.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, edited]

permissions:
  contents: read

concurrency:
  group: release-dry-run-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dry-run:
    name: Dry-run the release pipeline
    if: contains(github.event.pull_request.labels.*.name, 'release')
    runs-on: ubuntu-latest
    steps:
      # Title is user-controlled text — always through env, never interpolated into the script.
      - name: Parse version from the PR title
        id: version
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ "$TITLE" =~ ^v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$ ]]; then
            echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "::error::release PRs must be titled vX.Y.Z (got: $TITLE)"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/reader-artifacts

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install depot
        uses: cognitive-engineering-lab/depot/actions/install@main

      # file refs: internal deps point at the sibling tarballs on disk, so the smoke test
      # exercises the exact bytes that would publish — before any URL exists.
      - name: Pack (file refs) + clean-room install smoke test
        env:
          V: ${{ steps.version.outputs.version }}
        run: |
          node scripts/pack-release.mjs --version "$V" --refs file --out "$RUNNER_TEMP/release-file"
          bash scripts/smoke-install.sh "$RUNNER_TEMP/release-file/nota-lang-cli-$V.tgz"

      - name: Pack (url refs — the publishable flavor)
        env:
          V: ${{ steps.version.outputs.version }}
        run: node scripts/pack-release.mjs --version "$V" --refs url --out dist-release --skip-build

      # Bundles extension + language server + wasm reader, and runs an LSP initialize handshake
      # against the bundled server before packaging.
      - name: Build vsix
        env:
          V: ${{ steps.version.outputs.version }}
        run: node packages/vscode-nota/scripts/package-vsix.mjs --version "$V" --out dist-release

      - uses: actions/upload-artifact@v4
        with:
          name: release-tarballs
          path: dist-release
          retention-days: 14
