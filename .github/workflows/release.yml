name: Release

# Publishes when a `release`-labeled PR titled `vX.Y.Z` MERGES (the dry-run workflow is the
# pre-merge gate). CI creates the tag — `gh release create --target <merge-sha>` — so no manual
# tag push is involved. Assets: the nine url-ref tarballs plus unversioned cli/vite aliases
# (stable releases/latest/download/ URLs). Ends with a smoke test installing from the real URL.

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Publish GitHub release
    if: github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'release')
    runs-on: ubuntu-latest
    steps:
      - name: Parse version from the PR title
        id: version
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ "$TITLE" =~ ^v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$ ]]; then
            echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "::error::release PRs must be titled vX.Y.Z (got: $TITLE)"
            exit 1
          fi

      - name: Fail early if the tag already exists
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.version.outputs.version }}
        run: |
          if gh api "repos/${{ github.repository }}/git/ref/tags/v$V" >/dev/null 2>&1; then
            echo "::error::tag v$V already exists — bump the release PR title"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          submodules: recursive

      - uses: ./.github/actions/reader-artifacts

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install depot
        uses: cognitive-engineering-lab/depot/actions/install@main

      - name: Pack (url refs)
        env:
          V: ${{ steps.version.outputs.version }}
        run: node scripts/pack-release.mjs --version "$V" --refs url --out dist-release

      # Bundles extension + language server + wasm reader, and runs an LSP initialize handshake
      # against the bundled server before packaging.
      - name: Build vsix
        env:
          V: ${{ steps.version.outputs.version }}
        run: node packages/vscode-nota/scripts/package-vsix.mjs --version "$V" --out dist-release

      # PR body is user-controlled text — through env into --notes-file, never interpolated.
      - name: Create the release (tags the merge commit)
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.version.outputs.version }}
          NOTES: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n' "$NOTES" > "$RUNNER_TEMP/notes.md"
          gh release create "v$V" \
            --target "${{ github.event.pull_request.merge_commit_sha }}" \
            --title "v$V" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            dist-release/*.tgz dist-release/*.vsix

      - name: Post-publish smoke test (install from the real URL)
        env:
          V: ${{ steps.version.outputs.version }}
        run: bash scripts/smoke-install.sh "https://github.com/${{ github.repository }}/releases/download/v$V/nota-lang-cli-$V.tgz"
