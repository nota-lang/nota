name: Release

on:
  pull_request:
    types: [closed]

jobs:
  release:
    name: Publish to npm
    if: github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'release')
    runs-on: ubuntu-latest
    steps:
      - name: Version from PR title
        id: version
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ "$TITLE" =~ ^v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$ ]]; then
            echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "::error::release PRs must be titled vX.Y.Z (got: $TITLE)"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup
        uses: ./.github/actions/setup

      - name: Authenticate Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.11.0
          # Necessary so pnpm publish works
          registry-url: "https://registry.npmjs.org"

      - name: Build
        run: depot build --release

      - name: Stamp version
        run: pnpm -r exec npm pkg set version=${{ steps.version.outputs.version }}

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm publish --recursive --access public --no-git-checks
