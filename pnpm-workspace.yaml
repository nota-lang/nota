packages:
  - 'packages/*'
  # The wasm reader builds (gitignored, generated by `just nota-build` in oxc/) are workspace
  # members so deps on them are plain `workspace:*` and `pnpm -r publish` includes them.
  - 'oxc/napi/nota_wasm/pkg'
  - 'oxc/napi/nota_wasm/pkg-node'

# Blocked lifecycle scripts: esbuild works from its platform optionalDeps without the postinstall;
# vsce-sign/keytar only matter for Marketplace publish/signing, which we don't do (vsix-on-release).
allowBuilds:
  '@vscode/vsce-sign': false
  esbuild: false
  keytar: false

# pnpm >= 10 reads overrides from here, not package.json#pnpm
overrides:
  rollup: 'npm:@rollup/wasm-node'
