packages:
  - 'packages/*'
  # Mothballed by the Solid specialization (design/solid.md; this branch): the React adapter,
  # the React Router integrator, and the
  # playground (a React app over the old runtime; returns with in-browser JSX compilation —
  # design/solid.md §Follow-ups). Dirs kept for diffing; excluded so the workspace stays
  # installable without React.
  - '!packages/react'
  - '!packages/react-router'
  - '!packages/playground'

allowBuilds:
  esbuild: true
  keytar: true

overrides:
  rollup: 'npm:@rollup/wasm-node'
